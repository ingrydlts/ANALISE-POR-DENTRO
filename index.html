<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Por Dentro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root {
  --bege:#F2EDE4; --marrom:#3D2B1F; --oliva:#7A7D5A; --azul:#8FA5B8;
  --ocre:#C49A4E; --vinho:#6B2737; --off-white:#FAF8F4; --cinza:#9E9E8E;
  --text:#2A1F18; --verde:#6B8F6A; --bege-escuro:#E8E0D2;
  --yt-red:#FF0000; --ig-pink:#E1306C; --ig-purple:#833AB4;
  --p01:var(--ocre); --p02:var(--marrom); --p03:var(--vinho); --p04:var(--azul);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bege);color:var(--text);font-size:14px;line-height:1.7;}
.masthead{background:var(--marrom);padding:18px 40px;box-shadow:0 2px 20px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:space-between;}
.brand{font-family:'Playfair Display',serif;font-size:20px;color:var(--off-white);letter-spacing:1px;}
.brand span{color:var(--ocre);font-style:italic;}
.masthead-sub{font-family:'DM Mono',monospace;font-size:10px;color:rgba(242,237,228,0.45);letter-spacing:2px;text-transform:uppercase;}
.hero{background:var(--marrom);padding:28px 40px 0;}
.hero-tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--ocre);margin-bottom:12px;}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(26px,4vw,38px);color:var(--off-white);line-height:1.1;margin-bottom:20px;}
.hero h1 em{color:var(--ocre);font-style:italic;}

/* TABS */
.tabs{background:var(--marrom);padding:0 40px;display:flex;gap:2px;border-bottom:1px solid rgba(196,154,78,0.2);overflow-x:auto;}
.tab{padding:12px 16px;border:none;background:transparent;color:rgba(242,237,228,0.55);font-size:12px;font-family:'DM Sans',sans-serif;letter-spacing:0.3px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;transition:all .15s;}
.tab:hover{color:rgba(242,237,228,0.85);}
.tab.on{color:var(--ocre);border-bottom-color:var(--ocre);}

.wrap{max-width:1080px;margin:0 auto;padding:32px 40px 80px;}
.pane{display:none;}
.pane.on{display:block;}

.cycle-picker{display:flex;align-items:center;gap:10px;margin-bottom:28px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--cinza);}
.cycle-picker select{font-family:'DM Sans',sans-serif;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid rgba(61,43,31,0.2);background:var(--off-white);color:var(--marrom);}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:rgba(61,43,31,0.12);border-radius:8px;overflow:hidden;margin-bottom:28px;}
.kpi{background:var(--off-white);padding:20px 22px;}
.kv{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--marrom);line-height:1;margin-bottom:4px;}
.kv.ig{color:var(--ig-pink);}
.kv.pos{color:var(--verde);} .kv.neg{color:var(--vinho);}
.kl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--cinza);margin-bottom:4px;}
.kn{font-size:11px;color:var(--oliva);}
@media(max-width:800px){.kpi-grid{grid-template-columns:1fr 1fr;}}

.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px;}
@media(max-width:800px){.charts-grid{grid-template-columns:1fr;}}
.chart-card{background:var(--off-white);border-radius:12px;padding:20px 22px;border:1px solid rgba(61,43,31,0.08);}
.chart-card h3{font-family:'Playfair Display',serif;font-size:16px;color:var(--marrom);margin-bottom:12px;}

.sec-hd{display:flex;align-items:baseline;gap:16px;margin:36px 0 20px;padding-bottom:12px;border-bottom:1px solid var(--bege-escuro);}
.sec-hd:first-child{margin-top:0;}
.sec-hd h2{font-family:'Playfair Display',serif;font-size:22px;color:var(--marrom);}
.sec-hd h2 em{color:var(--ocre);font-style:italic;}
.sec-hd .sub{font-size:11px;color:var(--cinza);}

.insight-card{background:var(--off-white);border-radius:10px;border:1px solid rgba(61,43,31,0.08);padding:20px 22px;margin-bottom:14px;}
.insight-card .meta{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ocre);margin-bottom:10px;}
.insight-list{list-style:none;margin-bottom:14px;}
.insight-list li{font-size:13px;color:#5A4A3A;padding:8px 0;border-bottom:1px solid rgba(61,43,31,0.06);}
.insight-list li:last-child{border-bottom:none;}
.action-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(61,43,31,0.06);align-items:flex-start;}
.action-row:last-child{border-bottom:none;}
.action-num{font-family:'Playfair Display',serif;font-weight:700;color:var(--ocre);width:20px;flex-shrink:0;}
.pill{display:inline-block;font-family:'DM Mono',monospace;font-size:9px;padding:2px 8px;border-radius:10px;letter-spacing:1px;text-transform:uppercase;margin-right:8px;}
.pill-yt{background:var(--yt-red);color:#fff;}
.pill-ig{background:var(--ig-pink);color:#fff;}
.decisao{background:var(--marrom);color:var(--off-white);border-radius:10px;padding:20px 24px;margin-top:20px;}
.decisao .tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ocre);margin-bottom:8px;}
.decisao p{font-family:'Playfair Display',serif;font-size:17px;line-height:1.4;font-style:italic;}
.empty{padding:60px 40px;text-align:center;color:var(--cinza);font-family:'DM Mono',monospace;font-size:12px;}
.empty-tab{padding:40px 30px;text-align:center;color:var(--cinza);font-family:'DM Mono',monospace;font-size:11px;line-height:1.9;background:var(--off-white);border-radius:10px;border:1px dashed rgba(61,43,31,0.18);}
.footer-note{margin-top:40px;font-size:11px;color:var(--cinza);text-align:center;}

/* METAS */
.progress-wrap{background:var(--off-white);border-radius:10px;border:1px solid rgba(61,43,31,0.08);padding:22px 24px;margin-bottom:20px;}
.progress-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--oliva);margin-bottom:8px;}
.progress-bar-bg{height:10px;background:var(--bege-escuro);border-radius:6px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--ocre),var(--vinho));border-radius:6px;}
.progress-foot{display:flex;justify-content:space-between;margin-top:10px;font-family:'DM Mono',monospace;font-size:10px;color:var(--cinza);}
.nota-box{font-size:12px;color:#5A4A3A;background:var(--off-white);border-left:3px solid var(--ocre);border-radius:0 8px 8px 0;padding:12px 16px;margin-top:6px;}

/* SEMANAL TABLE */
.tbl-wrap{background:var(--off-white);border-radius:10px;border:1px solid rgba(61,43,31,0.08);overflow:hidden;margin-bottom:28px;overflow-x:auto;}
table.data-tbl{width:100%;border-collapse:collapse;min-width:640px;}
table.data-tbl th{background:var(--marrom);color:var(--off-white);font-size:10px;letter-spacing:0.8px;text-transform:uppercase;padding:10px 14px;text-align:left;font-weight:500;}
table.data-tbl td{padding:10px 14px;font-size:12px;border-bottom:1px solid rgba(61,43,31,0.06);vertical-align:top;}
table.data-tbl tr:last-child td{border-bottom:none;}
table.data-tbl tr:nth-child(even) td{background:rgba(61,43,31,0.02);}
.badge{display:inline-block;font-size:9px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:8px;letter-spacing:0.5px;}
.badge-on{background:rgba(107,143,106,0.18);color:var(--verde);}
.badge-off{background:rgba(158,158,142,0.18);color:var(--cinza);}

/* CONCORRENCIA */
.chip-group{margin-bottom:10px;}
.chip-group-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--cinza);margin-bottom:8px;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--off-white);border:1px solid rgba(61,43,31,0.12);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--marrom);}
.bench-card{background:var(--off-white);border-radius:10px;border:1px solid rgba(61,43,31,0.08);padding:20px 22px;margin-bottom:16px;}
.bench-card .meta{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ocre);margin-bottom:14px;}
.bench-block{margin-bottom:14px;}
.bench-block:last-child{margin-bottom:0;}
.bench-block .lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--oliva);margin-bottom:5px;font-weight:600;}
.bench-block .txt{font-size:13px;color:#5A4A3A;white-space:pre-line;}
.bench-reco{background:var(--marrom);color:var(--off-white);border-radius:8px;padding:16px 18px;margin-top:16px;}
.bench-reco .lbl{color:var(--ocre);}
.bench-reco .txt{color:var(--off-white);font-style:italic;font-family:'Playfair Display',serif;font-size:14px;}

/* AUDIENCIA */
.persona-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px;}
@media(max-width:800px){.persona-grid{grid-template-columns:1fr;}}
.persona-card{background:var(--off-white);border-radius:10px;border-left:4px solid var(--p01);box-shadow:0 2px 10px rgba(61,43,31,0.06);cursor:pointer;overflow:hidden;transition:box-shadow .15s;}
.persona-card:hover{box-shadow:0 4px 16px rgba(61,43,31,0.12);}
.persona-card[data-p="P02"]{border-left-color:var(--p02);}
.persona-card[data-p="P03"]{border-left-color:var(--p03);}
.persona-card[data-p="P04"]{border-left-color:var(--p04);}
.persona-top{padding:16px 18px 0;}
.persona-id{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ocre);margin-bottom:4px;}
.persona-name{font-family:'Playfair Display',serif;font-size:17px;color:var(--marrom);}
.persona-sub{font-size:11px;color:var(--cinza);margin-top:2px;}
.persona-quote{margin:12px 18px 0;padding:10px 12px;background:var(--bege-escuro);border-radius:6px;font-style:italic;font-size:12px;color:#5A4A3A;}
.persona-body{padding:12px 18px 16px;font-size:12px;color:#5A4A3A;}
.persona-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.persona-tag{font-size:10px;padding:3px 9px;border-radius:20px;background:var(--bege-escuro);color:var(--marrom);}
.persona-cta{padding:0 18px 14px;font-size:11px;color:var(--cinza);text-align:right;}
.persona-detail{display:none;padding:0 18px 18px;border-top:1px solid rgba(61,43,31,0.08);margin-top:4px;padding-top:14px;}
.persona-card.expanded .persona-detail{display:block;}
.persona-detail .dl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--oliva);font-weight:600;margin:12px 0 5px;}
.persona-detail .dl:first-child{margin-top:0;}
.persona-detail ul{list-style:none;font-size:12px;color:#5A4A3A;}
.persona-detail ul li{padding:3px 0;}
.persona-detail ul li::before{content:'— ';color:var(--cinza);}
.persona-detail p{font-size:12px;color:#5A4A3A;line-height:1.6;}

.journey-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px;}
@media(max-width:700px){.journey-row{grid-template-columns:1fr 1fr;}}
.journey-step{background:var(--off-white);border-radius:8px;padding:14px 12px;text-align:center;border-top:3px solid var(--ocre);}
.journey-step .lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--marrom);font-weight:600;margin-bottom:6px;}
.journey-step .per{font-family:'Playfair Display',serif;font-size:12px;color:var(--oliva);margin-bottom:4px;}
.journey-step .em{font-size:11px;color:var(--cinza);}

.bilan-card{background:var(--off-white);border-radius:10px;border:1px solid rgba(61,43,31,0.08);padding:18px 20px;margin-bottom:14px;}
.bilan-card .meta{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ocre);margin-bottom:10px;}
.segment-row{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;}
.segment-pill{font-size:11px;font-family:'DM Mono',monospace;color:var(--marrom);background:var(--bege-escuro);padding:4px 10px;border-radius:6px;}

/* BOAS PRATICAS */
.quadrant-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
@media(max-width:700px){.quadrant-grid{grid-template-columns:1fr;}}
.quadrant{background:var(--off-white);border-radius:10px;padding:16px 18px;border-left:4px solid var(--cinza);}
.quadrant.aplicar{border-left-color:var(--verde);}
.quadrant.testar{border-left-color:var(--ocre);}
.quadrant.ignorar{border-left-color:var(--vinho);}
.quadrant.confirmar{border-left-color:var(--azul);}
.quadrant .qh{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;color:var(--marrom);}
.quadrant ul{list-style:none;}
.quadrant li{font-size:12px;color:#5A4A3A;padding:6px 0;border-bottom:1px solid rgba(61,43,31,0.06);}
.quadrant li:last-child{border-bottom:none;}
.quadrant li strong{color:var(--marrom);}

/* CALENDARIO */
.season-tbl-wrap{margin-bottom:32px;}
.week-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;}
@media(max-width:800px){.week-grid{grid-template-columns:1fr 1fr;}}
.week-card{background:var(--off-white);border-radius:8px;padding:14px;border:1px solid rgba(61,43,31,0.08);}
.week-card .wn{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ocre);margin-bottom:4px;}
.week-card .wt{font-family:'Playfair Display',serif;font-size:13px;color:var(--marrom);margin-bottom:8px;}
.week-card .wp{font-size:11px;color:#5A4A3A;margin-bottom:4px;}
.week-card .wp b{color:var(--marrom);}
.cal-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:var(--marrom);border-radius:10px;padding:18px 20px;margin-top:14px;}
@media(max-width:700px){.cal-summary{grid-template-columns:1fr 1fr;}}
.cal-summary .cs-item{text-align:center;}
.cal-summary .cs-num{font-family:'Playfair Display',serif;font-size:22px;color:var(--off-white);}
.cal-summary .cs-lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ocre);margin-top:2px;}

/* CALENDARIO REAL — grade mensal (replica o calendário do Notion) */
.real-cal-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.real-cal-tabs button{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.5px;padding:7px 16px;border-radius:20px;border:1px solid rgba(61,43,31,0.18);background:var(--off-white);color:var(--marrom);cursor:pointer;}
.real-cal-tabs button.on{background:var(--marrom);color:var(--off-white);border-color:var(--marrom);}
.real-cal-scroll{overflow-x:auto;margin-bottom:16px;-webkit-overflow-scrolling:touch;}
.real-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(112px,1fr));gap:1px;background:rgba(61,43,31,0.1);border-radius:10px;overflow:hidden;border:1px solid rgba(61,43,31,0.1);min-width:784px;}
.real-cal-dow{background:var(--marrom);color:var(--ocre);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;text-align:center;padding:8px 4px;position:sticky;top:0;}
.real-cal-cell{background:var(--off-white);min-height:86px;min-width:0;padding:6px;display:flex;flex-direction:column;gap:3px;}
.real-cal-cell.empty{background:rgba(61,43,31,0.02);}
.real-cal-cell.today{box-shadow:inset 0 0 0 2px var(--ocre);}
.real-cal-daynum{font-family:'DM Mono',monospace;font-size:10px;color:var(--cinza);margin-bottom:2px;font-variant-numeric:tabular-nums;}
.real-cal-chip{font-size:10px;line-height:1.3;padding:3px 6px;border-radius:5px;cursor:pointer;border-left:3px solid var(--cinza);background:var(--bege-escuro);color:var(--marrom);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.real-cal-chip:hover{filter:brightness(0.96);}
.real-cal-chip.on{outline:2px solid var(--marrom);}
.real-cal-chip.stage-done{border-left-color:var(--verde);}
.real-cal-chip.stage-progress{border-left-color:var(--ocre);}
.real-cal-chip.stage-todo{border-left-color:var(--cinza);}
.real-cal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:var(--marrom);border-radius:10px;padding:16px 18px;margin-bottom:16px;}
@media(max-width:700px){.real-cal-stats{grid-template-columns:1fr 1fr;}}
.real-cal-stats .cs-item{text-align:center;}
.real-cal-stats .cs-num{font-family:'Playfair Display',serif;font-size:22px;color:var(--off-white);font-variant-numeric:tabular-nums;}
.real-cal-stats .cs-lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ocre);margin-top:2px;}
.real-cal-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:11px;color:var(--oliva);}
.real-cal-legend span{display:inline-flex;align-items:center;gap:5px;}
.real-cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.real-cal-detail{background:var(--off-white);border-radius:10px;border:1px solid rgba(61,43,31,0.08);padding:18px 20px;margin-bottom:28px;}
.real-cal-detail .rd-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--marrom);margin-bottom:8px;}
.real-cal-detail .rd-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.real-cal-detail .rd-promessa{font-size:12px;color:#5A4A3A;line-height:1.6;margin-bottom:10px;}
.real-cal-detail a{font-size:11px;color:var(--ocre);text-decoration:none;}
.real-cal-detail a:hover{text-decoration:underline;}

/* Dropdown / accordion */
.dd-card{background:var(--off-white);border-radius:10px;border:1px solid rgba(61,43,31,0.08);margin-bottom:14px;overflow:hidden;}
.dd-header{padding:20px 22px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.dd-header:hover{background:rgba(61,43,31,0.02);}
.dd-caret{font-family:'DM Mono',monospace;color:var(--ocre);font-size:12px;flex-shrink:0;transition:transform .15s;}
.dd-card.open .dd-caret{transform:rotate(90deg);}
.dd-body{display:none;padding:0 22px 22px;}
.dd-card.open .dd-body{display:block;}
</style>
</head>
<body>

<div class="masthead">
  <div class="brand">Por <span>Dentro</span></div>
  <div class="masthead-sub" id="last-updated">—</div>
</div>

<div class="hero">
  <div class="hero-tag">Dashboard · Memória Acumulativa</div>
  <h1 id="hero-title">Carregando <em>dados</em>…</h1>
</div>

<nav class="tabs" id="tabs"></nav>

<div class="wrap" id="app">
  <div class="empty">Carregando insights.json…</div>
</div>

<script>
const TABS = [
  {id:'metas',       label:'Metas'},
  {id:'semanal',     label:'Semanal'},
  {id:'performance', label:'Performance'},
  {id:'concorrencia',label:'Concorrência'},
  {id:'audiencia',   label:'Audiência'},
  {id:'boas',        label:'Boas Práticas'},
  {id:'calendario',  label:'Calendário'},
];

let DATA = null;
let CANAIS = null;

async function loadData() {
  try {
    const [resInsights, resCanais] = await Promise.all([
      fetch('./insights.json', {cache:'no-store'}),
      fetch('./canais.json', {cache:'no-store'}).catch(()=>null)
    ]);
    if (!resInsights.ok) throw new Error('HTTP ' + resInsights.status);
    DATA = await resInsights.json();
    CANAIS = (resCanais && resCanais.ok) ? await resCanais.json() : {categoria_a_diretos:[],categoria_b_formato:[],categoria_c_qualidade:[]};
    render();
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<div class="empty">Não consegui carregar <b>insights.json</b> (${e.message}).<br>
       Se você abriu este arquivo direto do disco (file://), o navegador bloqueia o fetch local —
       rode <code>python3 -m http.server</code> nesta pasta ou acesse via GitHub Pages.</div>`;
  }
}

function fmtNum(n) {
  if (n === null || n === undefined) return '—';
  return new Intl.NumberFormat('pt-BR').format(n);
}
function fmtPct(n, digits=1) {
  if (n === null || n === undefined) return '—';
  return n.toFixed(digits).replace('.', ',') + '%';
}
function fmtDelta(n, digits=0) {
  if (n === null || n === undefined) return '';
  const sign = n > 0 ? '+' : '';
  return `${sign}${digits ? n.toFixed(digits) : Math.round(n)}%`;
}
function deltaClass(n) {
  if (n === null || n === undefined) return '';
  return n >= 0 ? 'pos' : 'neg';
}
function esc(s) { return (s === null || s === undefined) ? '' : String(s); }

function render() {
  document.getElementById('last-updated').textContent = 'Atualizado em ' + (DATA.criado_em || '—');
  document.getElementById('hero-title').innerHTML = `<em>${esc(DATA.projeto || 'Por Dentro')}</em> — ${esc(DATA.canal_youtube||'')} · ${esc(DATA.instagram||'')}`;

  const tabsNav = document.getElementById('tabs');
  tabsNav.innerHTML = TABS.map((t,i) => `<button class="tab${i===2?' on':''}" data-i="${i}">${t.label}</button>`).join('');
  tabsNav.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => go(parseInt(btn.dataset.i))));

  const app = document.getElementById('app');
  app.innerHTML = TABS.map(t => `<div class="pane" id="pane-${t.id}"></div>`).join('');

  renderMetas();
  renderSemanal();
  renderPerformance();
  renderConcorrencia();
  renderAudiencia();
  renderBoasPraticas();
  renderCalendario();

  go(2); // Performance é a aba padrão (é a que tem dado mais rico hoje)
}

function go(i) {
  document.querySelectorAll('.tab').forEach((t,idx) => t.classList.toggle('on', idx===i));
  document.querySelectorAll('.pane').forEach((p,idx) => p.classList.toggle('on', idx===i));
}

/* ══════════════════════ METAS ══════════════════════ */
function renderMetas() {
  const m = DATA.metas || {};
  const s = m.seguidores || {};
  const e = m.engajamento || {};
  const pane = document.getElementById('pane-metas');

  const hoje = new Date();
  const baseline = s.baseline_data ? new Date(s.baseline_data) : null;
  const metaData = s.meta_data ? new Date(s.meta_data) : null;
  let diasPassados = null, diasRestantes = null, ritmoRecalc = null;
  if (baseline && metaData) {
    diasPassados = Math.max(0, Math.round((hoje - baseline) / 86400000));
    diasRestantes = Math.max(1, Math.round((metaData - hoje) / 86400000));
    ritmoRecalc = s.seguidores_necessarios != null ? (s.seguidores_necessarios / diasRestantes) : null;
  }
  const pctProgresso = (s.baseline != null && s.meta != null) ? Math.min(100, Math.max(0, (s.baseline - s.baseline) / (s.meta - s.baseline) * 100)) : 0;

  pane.innerHTML = `
    <div class="sec-hd"><h2>Meta de <em>Seguidores</em></h2></div>
    <div class="progress-wrap">
      <div class="progress-labels"><span>${fmtNum(s.baseline)} (baseline ${esc(s.baseline_data)})</span><span>${fmtNum(s.meta)} (prazo ${esc(s.meta_data)})</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pctProgresso}%"></div></div>
      <div class="progress-foot"><span>Faltam ${fmtNum(s.seguidores_necessarios)} seguidores</span><span>${diasRestantes!=null ? diasRestantes+' dias restantes' : ''}</span></div>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kl">Ritmo necessário / dia</div><div class="kv">${s.ritmo_necessario_dia ?? '—'}</div><div class="kn">recalculado hoje: ${ritmoRecalc ? ritmoRecalc.toFixed(1) : '—'}/dia</div></div>
      <div class="kpi"><div class="kl">Ritmo necessário / semana</div><div class="kv">${s.ritmo_necessario_semana ?? '—'}</div><div class="kn">seguidores/semana</div></div>
      <div class="kpi"><div class="kl">Ritmo de referência (Jun)</div><div class="kv">${s.ritmo_referencia_dia_junho ?? '—'}</div><div class="kn">${s.ritmo_referencia_semana_junho ?? '—'}/semana</div></div>
      <div class="kpi"><div class="kl">Gap de ritmo</div><div class="kv ${deltaClass(s.gap_ritmo_pct)}">${s.gap_ritmo_pct != null ? fmtDelta(s.gap_ritmo_pct,1) : '—'}</div><div class="kn">projeção 365d: ${fmtNum(s.projecao_365d_no_ritmo_junho)}</div></div>
    </div>
    ${s.nota ? `<div class="nota-box">${esc(s.nota)}</div>` : ''}

    <div class="sec-hd"><h2>Piso de <em>Engajamento</em></h2></div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kl">Média atual</div><div class="kv">${fmtPct(e.media_atual_pct, 2)}</div><div class="kn">método: ${esc(e.metodo)}</div></div>
      <div class="kpi"><div class="kl">Piso de alerta</div><div class="kv">${fmtPct(e.piso_pct, 1)}</div><div class="kn">tolerância: ${e.margem_tolerancia_pontos ?? '—'} pontos</div></div>
      <div class="kpi"><div class="kl">Ciclos considerados</div><div class="kv" style="font-size:16px;">${(e.ciclos_considerados||[]).join(', ') || '—'}</div><div class="kn">base do cálculo</div></div>
      <div class="kpi"><div class="kl">Status</div><div class="kv ${e.media_atual_pct >= e.piso_pct ? 'pos' : 'neg'}" style="font-size:16px;">${e.media_atual_pct >= e.piso_pct ? 'Acima do piso' : 'Abaixo do piso'}</div><div class="kn">revisar calendário se abaixo</div></div>
    </div>
    ${e.nota ? `<div class="nota-box">${esc(e.nota)}</div>` : ''}
  `;
}

  const semanas = DATA.semanas || [];

  let htmlDiario = '';
  if (diario.length) {

    htmlDiario = `
      <div class="sec-hd"><h2>Instagram <em>Diário</em></h2><span class="sub">${diario.length} dia(s) · ${esc(diario[0].data)} a ${esc(diario[diario.length-1].data)} · sobe pelo painel-atualizacao.html</span></div>

      <td style="max-width:260px;">${esc(s.nota)}</td>
    </tr>`).join('');

  const htmlSemanal = semanas.length ? `
    <div class="sec-hd"><h2>Check-ins <em>Semanais</em></h2><span class="sub">${semanas.length} semana(s) registrada(s)</span></div>
    <div class="charts-grid">
      <div class="chart-card"><h3>Alcance por semana</h3><canvas id="chart-semanal-alcance" height="180"></canvas></div>
      <div class="chart-card"><h3>Seguidores ganhos por semana</h3><canvas id="chart-semanal-seg" height="180"></canvas></div>
    </div>
    <div class="tbl-wrap">
      <table class="data-tbl">
        <thead><tr><th>Período</th><th>Alcance</th><th>Interações</th><th>Seguidores</th><th>Engaj.</th><th>Status</th><th>Nota</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  ` : '';

  pane.innerHTML = htmlDiario + htmlSemanal;

  if (diario.length) {
    const labelsDiario = diario.map(d => d.data.slice(5)); // MM-DD, mais legível numa série longa
    new Chart(document.getElementById('chart-diario-alcance'), {

  function drawPerformanceCharts() {
    const labels = ciclos.map(c => c.periodo || c.id);

    if (chartViews) chartViews.destroy();
    if (chartAlcance) chartAlcance.destroy();

  }

  select.addEventListener('change', () => renderCycle(parseInt(select.value)));
  renderCycle(ciclos.length - 1);

  html += `<div class="sec-hd"><h2>Bilan Qualitativo <em>Semanal</em></h2><span class="sub">${bilans.length} rodada(s) · gerado por scripts/analyze_audiencia.py</span></div>`;
  if (!bilans.length) {
    html += `<div class="empty-tab">Nenhum bilan de audiência semanal publicado ainda.<br>Roda toda sexta-feira via <code>scripts/analyze_audiencia.py</code>, a partir de DMs/comentários enriquecidos no Notion.</div>`;
  } else {
    [...bilans].reverse().forEach(b => {
      html += `
        <div class="bilan-card">
          <div class="meta">${esc(b.periodo_label || b.id)} · ${fmtNum(b.total_entradas_analisadas)} entradas analisadas</div>
          ${b.perfil_momento ? `<p style="font-size:13px;color:#5A4A3A;margin-bottom:8px;"><strong>Perfil do momento:</strong> ${esc(b.perfil_momento)}</p>` : ''}
          ${(b.perguntas_recorrentes||[]).length ? `<div class="bench-block"><div class="lbl">Perguntas recorrentes</div><ul class="insight-list">${b.perguntas_recorrentes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
          ${(b.dores_nao_atendidas||[]).length ? `<div class="bench-block"><div class="lbl">Dores não atendidas</div><ul class="insight-list">${b.dores_nao_atendidas.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
          ${(b.pautas_sugeridas||[]).length ? `<div class="bench-block"><div class="lbl">Pautas sugeridas</div><ul class="insight-list">${b.pautas_sugeridas.map(x=>`<li>[${esc(x.plataforma)}] ${esc(x.titulo)} — ${esc(x.porque)}</li>`).join('')}</ul></div>` : ''}
          ${b.segmentos ? `<div class="segment-row">
            <span class="segment-pill">Brasil: ${fmtNum(b.segmentos.brasil)}</span>
            <span class="segment-pill">Processo: ${fmtNum(b.segmentos.processo)}</span>
            <span class="segment-pill">França: ${fmtNum(b.segmentos.franca)}</span>
          </div>` : ''}
        </div>`;
    });
  }

  if (ap.principio_editorial) {
    html += `<div class="decisao"><div class="tag">Princípio editorial</div><p>${esc(ap.principio_editorial)}</p></div>`;
  }

  pane.innerHTML = html;
}

/* ══════════════════════ CALENDARIO ══════════════════════ */
const CALENDARIO_SAZONAL = [
  {mes:'Janeiro', tema:'Voeux, CAF atualização, início de ano'},
  {mes:'Fev–Abr', tema:'Imposto de renda francês'},
  {mes:'Maio', tema:'Feriados franceses (mês mais feriado)'},
  {mes:'Junho', tema:'Fim do ano letivo, verão europeu'},
  {mes:'Jul–Ago', tema:'Vida no verão, o que fecha/abre'},
  {mes:'Setembro', tema:'Rentrée — volta às aulas e à rotina'},
  {mes:'Outubro', tema:'Mudança de estação, custos de energia'},
  {mes:'Novembro', tema:'Black Friday na França vs. Brasil'},
  {mes:'Dezembro', tema:'Natal, réveillon, o que muda em janeiro'},
];

const DOW_LABELS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MES_NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let realCalMonth = null;
let realCalSelectedUrl = null;

function stageClass(estagio) {
  const s = (estagio || '').toLowerCase();
  if (s === 'done' || s === 'scheduled') return 'stage-done';
  if (s === 'idea' || s === 'backlog' || s === 'draft') return 'stage-todo';
  return 'stage-progress'; // design, research, to film, to edit
}

function renderCalendario() {
  const pane = document.getElementById('pane-calendario');
  const cal = DATA.calendario || [];

  const seasonRows = CALENDARIO_SAZONAL.map(s => `<tr><td>${s.mes}</td><td>${s.tema}</td></tr>`).join('');

  let html = `
    <div class="sec-hd"><h2>Calendário <em>Sazonal</em></h2><span class="sub">referência fixa de priorização</span></div>
    <div class="tbl-wrap season-tbl-wrap">
      <table class="data-tbl"><thead><tr><th>Período</th><th>Tema prioritário</th></tr></thead><tbody>${seasonRows}</tbody></table>
    </div>

    <div class="sec-hd"><h2>Calendário <em>Real</em></h2><span class="sub">replicado do Notion — clique num post pra ver os detalhes</span></div>
    <div id="real-cal-tabs" class="real-cal-tabs"></div>
    <div id="real-cal-stats" class="real-cal-stats"></div>
    <div class="real-cal-legend">
      <span><i style="background:var(--verde)"></i> Pronto (Scheduled/Done)</span>
      <span><i style="background:var(--ocre)"></i> Em produção (Design/Research/to film/to edit)</span>
      <span><i style="background:var(--cinza)"></i> Ainda ideia (Idea/Backlog)</span>
    </div>
    <div class="real-cal-scroll"><div id="real-cal-grid" class="real-cal-grid"></div></div>
    <div id="real-cal-detail"></div>

    <div class="sec-hd"><h2>Calendário <em>Editorial</em></h2><span class="sub">${cal.length} análise(s) publicada(s)</span></div>
  `;

  if (!cal.length) {
    html += `<div class="empty-tab">Nenhum calendário editorial mensal publicado ainda.<br>Módulo 5 — combina o bilan do mês anterior + benchmark de concorrência + boas práticas. Publique pelo painel-atualizacao.html.</div>`;
  } else {
    [...cal].reverse().forEach((c, idx) => {
      html += `
        <div class="dd-card${idx === 0 ? ' open' : ''}" id="dd-cal-${c.id}">
          <div class="dd-header" onclick="document.getElementById('dd-cal-${c.id}').classList.toggle('open')">
            <div>
              <div class="meta" style="margin-bottom:6px;">${esc(c.periodo || c.id)}</div>
              <div style="font-family:'Playfair Display',serif;font-size:16px;color:var(--marrom);">${esc(c.tema_central)}</div>
              <div style="font-size:12px;color:var(--oliva);margin-top:4px;">${esc(c.objetivo_mes)}</div>
            </div>
            <div class="dd-caret">▶</div>
          </div>
          <div class="dd-body">
            ${(c.achados_macro||[]).length ? `<div class="bench-block"><div class="lbl">Achados macro</div><ul class="insight-list">${c.achados_macro.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
            <div class="week-grid">
              ${(c.semanas||[]).map(w => `
                <div class="week-card">
                  <div class="wn">Semana ${w.numero}</div>
                  <div class="wt">${esc(w.tipo)}</div>
                  <div class="wp"><b>YT</b> ${esc(w.youtube) || '—'}</div>
                  <div class="wp"><b>IG</b> ${esc(w.instagram) || '—'}</div>
                  <div class="wp"><b>News</b> ${esc(w.newsletter) || '—'}</div>
                </div>`).join('')}
            </div>
            ${(c.datas_sazonais||[]).length ? `<div class="bench-block" style="margin-top:14px;"><div class="lbl">Datas sazonais a não perder</div><ul class="insight-list">${c.datas_sazonais.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
            ${(c.posts_analisados||[]).length ? `
            <div class="sec-hd" style="margin:24px 0 14px;"><h2 style="font-size:16px;">Posts já publicados <em>este mês</em></h2></div>
            <div class="tbl-wrap" style="margin-bottom:16px;">
              <table class="data-tbl"><thead><tr><th>Data</th><th>Post</th><th>Formato</th><th>Nota</th></tr></thead>
              <tbody>${c.posts_analisados.map(p => `<tr><td>${esc(p.data)}</td><td>${esc(p.titulo)}</td><td>${esc(p.formato)}</td><td>${esc(p.observacao)}</td></tr>`).join('')}</tbody></table>
            </div>` : ''}
            ${(c.pode_continuar||[]).length ? `<div class="quadrant aplicar"><div class="qh">O que pode continuar funcionando</div><ul>${c.pode_continuar.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
            ${(c.campo_melhora||[]).length ? `<div class="quadrant testar" style="margin-top:14px;"><div class="qh">O que tem campo para melhora</div><ul>${c.campo_melhora.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
          </div>
        </div>`;
    });
  }

  pane.innerHTML = html;
  renderRealCalendar();
}

/* ══════════════════════ CALENDARIO REAL (grade replicando o Notion) ══════════════════════ */
function renderRealCalendar() {
  const posts = DATA.calendario_posts || [];
  const tabsEl = document.getElementById('real-cal-tabs');
  const gridEl = document.getElementById('real-cal-grid');
  if (!tabsEl || !gridEl) return;

  if (!posts.length) {
    tabsEl.innerHTML = '';
    gridEl.innerHTML = `<div class="empty-tab" style="grid-column:1/-1;">Nenhum post sincronizado do Notion ainda.</div>`;
    return;
  }

  const meses = [...new Set(posts.map(p => p.data.slice(0,7)))].sort();
  const hojeMes = new Date().toISOString().slice(0,7);
  if (!realCalMonth || !meses.includes(realCalMonth)) {
    realCalMonth = meses.includes(hojeMes) ? hojeMes : meses[0];
  }

  tabsEl.innerHTML = meses.map(m => {
    const [y, mo] = m.split('-').map(Number);
    return `<button class="${m === realCalMonth ? 'on' : ''}" onclick="goRealCalMonth('${m}')">${MES_NOMES[mo-1]} ${y}</button>`;
  }).join('');

  drawRealCalStats();
  drawRealCalGrid();
}

function drawRealCalStats() {
  const statsEl = document.getElementById('real-cal-stats');
  if (!statsEl) return;
  const posts = (DATA.calendario_posts || []).filter(p => p.data.slice(0,7) === realCalMonth);
  const count = fmt => posts.filter(p => p.formato === fmt).length;
  const total = posts.length;
  statsEl.innerHTML = `
    <div class="cs-item"><div class="cs-num">${total}</div><div class="cs-lbl">Posts no mês</div></div>
    <div class="cs-item"><div class="cs-num">${count('Reel')}</div><div class="cs-lbl">Reels</div></div>
    <div class="cs-item"><div class="cs-num">${count('Carrossel')}</div><div class="cs-lbl">Carrosséis</div></div>
    <div class="cs-item"><div class="cs-num">${posts.filter(p => (p.serie||[]).length).length}</div><div class="cs-lbl">De série</div></div>
  `;
}

function goRealCalMonth(m) {
  realCalMonth = m;
  realCalSelectedUrl = null;
  document.getElementById('real-cal-detail').innerHTML = '';
  renderRealCalendar();
}

function drawRealCalGrid() {
  const gridEl = document.getElementById('real-cal-grid');
  const posts = (DATA.calendario_posts || []).filter(p => p.data.slice(0,7) === realCalMonth);
  const [y, mo] = realCalMonth.split('-').map(Number);

  const porDia = {};
  posts.forEach(p => {
    const dia = parseInt(p.data.slice(8,10), 10);
    (porDia[dia] = porDia[dia] || []).push(p);
  });

  const primeiroDow = new Date(y, mo-1, 1).getDay();
  const diasNoMes = new Date(y, mo, 0).getDate();
  const hojeStr = new Date().toISOString().slice(0,10);

  let cells = DOW_LABELS.map(d => `<div class="real-cal-dow">${d}</div>`).join('');
  for (let i = 0; i < primeiroDow; i++) cells += `<div class="real-cal-cell empty"></div>`;
  for (let d = 1; d <= diasNoMes; d++) {
    const dataStr = `${realCalMonth}-${String(d).padStart(2,'0')}`;
    const isToday = dataStr === hojeStr;
    const chips = (porDia[d] || []).map(p => `
      <div class="real-cal-chip ${stageClass(p.estagio)}${p.url === realCalSelectedUrl ? ' on' : ''}" title="${esc(p.titulo)}" onclick="showRealCalPost('${p.url}')">
        ${p.formato === 'Reel' ? '▶' : p.formato === 'Carrossel' ? '▦' : '●'} ${esc(p.titulo)}
      </div>`).join('');
    cells += `<div class="real-cal-cell${isToday ? ' today' : ''}"><div class="real-cal-daynum">${d}</div>${chips}</div>`;
  }
  gridEl.innerHTML = cells;
}

function showRealCalPost(url) {
  realCalSelectedUrl = url;
  drawRealCalGrid();
  const p = (DATA.calendario_posts || []).find(x => x.url === url);
  const detailEl = document.getElementById('real-cal-detail');
  if (!p) { detailEl.innerHTML = ''; return; }

  const chipsRow = (arr, cls) => (arr||[]).map(x => `<span class="badge ${cls}">${esc(x)}</span>`).join(' ');

  detailEl.innerHTML = `
    <div class="real-cal-detail">
      <div class="rd-title">${esc(p.titulo)}</div>
      <div class="rd-meta">
        <span class="badge badge-off">${esc(p.data)}</span>
        <span class="badge badge-off">${esc(p.formato || '—')}</span>
        <span class="badge ${stageClass(p.estagio) === 'stage-done' ? 'badge-on' : 'badge-off'}">${esc(p.estagio || '—')}</span>
        ${chipsRow(p.pilares, 'badge-off')}
        ${chipsRow(p.meta, 'badge-off')}
        ${chipsRow(p.publico, 'badge-off')}
        ${chipsRow(p.serie, 'badge-off')}
      </div>
      ${p.promessa ? `<div class="rd-promessa">${esc(p.promessa)}</div>` : ''}
      <a href="${esc(p.url)}" target="_blank" rel="noopener">Abrir no Notion →</a>
    </div>`;
}

loadData();
</script>
