name: Sugestões de Conteúdo (Módulo 5)

# Toda segunda de manhã — depois que a semana já está visível no calendário,
# antes da criadora planejar os próximos posts.
on:
  schedule:
    - cron: '0 7 * * 1'   # 07h UTC segunda-feira (~08-09h Paris, conforme horário de verão)
  workflow_dispatch: {}    # permite rodar manualmente pelo GitHub para testar

jobs:
  sugestoes:
    runs-on: ubuntu-latest
    # Sem isso, o GITHUB_TOKEN padrão é só leitura e o passo de commit no fim
    # falha com "Permission ... denied to github-actions[bot]" (403).
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Gerar sugestões de conteúdo
        run: python scripts/gerar_sugestoes_conteudo.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_DB_IG: ${{ secrets.NOTION_DB_IG }}
          NOTION_ANALISES_DB_ID: ${{ secrets.NOTION_ANALISES_DB_ID }}
          NOTION_BENCHMARKS_DB_ID: ${{ secrets.NOTION_BENCHMARKS_DB_ID }}
          NOTION_CALENDARIO_DB_ID: ${{ secrets.NOTION_CALENDARIO_DB_ID }}
          # Caminho do insights.json na raiz do repo (mesmo arquivo que o dashboard lê):
          INSIGHTS_JSON_PATH: insights.json

      - name: Commitar insights.json atualizado
        # git push sozinho falha com "Updates were rejected because the remote
        # contains work that you do not have locally" sempre que outro workflow
        # (ex.: Análise de Audiência disparada manualmente na mesma janela)
        # commita no insights.json entre o checkout e este push — confirmado em
        # produção em 2026-07-23. O retry com pull --rebase resolve puxando o
        # commit concorrente e tentando de novo, em vez de perder esta rodada.
        run: |
          git config user.name "por-dentro-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f "insights.json" ]; then
            git add insights.json
            if git diff --cached --quiet; then
              echo "Nada novo para commitar."
            else
              git commit -m "chore: sugestões de conteúdo + calendário atualizado (auto)"
              for i in 1 2 3 4 5; do
                git push && break
                echo "  ⚠ Push rejeitado (outra automação commitou antes) — puxando e tentando de novo (${i}/5)..."
                git pull --rebase origin main
              done
            fi
          else
            echo "⚠ 'insights.json' não existe no checkout — nada para commitar nesta rodada."
          fi
